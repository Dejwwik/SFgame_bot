[project]
name = "sfgame"
version = "0.1.0"
description = "Async automation platform for the browser RPG Shakes & Fidget"
license = "MIT"
authors = [{ name = "Lukáš Kožušník" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12.15",
    "aiosqlite>=0.22.1",
    "flask>=3.1.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-asyncio>=0.26.0"]

[tool.pytest.ini_options]
testpaths = ["sfbot"]
