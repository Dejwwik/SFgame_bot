<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SFgame Bot{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117; color: #c9d1d9; min-height: 100vh;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 24px; }

        h1 { color: #e6edf3; font-size: 22px; margin-bottom: 16px; }
        h2 { color: #e6edf3; font-size: 18px; margin-bottom: 12px; }
        h3 { color: #8b949e; font-size: 15px; margin-bottom: 10px; }
        h4 { color: #8b949e; }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .nav {
            background: #161b22; padding: 14px 24px; margin-bottom: 24px;
            border-radius: 10px; display: flex; gap: 20px; align-items: center;
            border: 1px solid #30363d;
        }
        .nav a { color: #c9d1d9; font-weight: 600; font-size: 14px; text-decoration: none; }
        .nav a:hover { color: #58a6ff; }
        .nav .sep { color: #30363d; }

        .flash { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .flash.success { background: #1a3a2a; color: #3fb950; border: 1px solid #238636; }
        .flash.error { background: #3d1a1e; color: #f85149; border: 1px solid #da3633; }

        .card {
            background: #161b22; border-radius: 10px; padding: 20px; margin-bottom: 16px;
            border: 1px solid #30363d;
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 7px 14px; border-radius: 6px; border: 1px solid transparent;
            cursor: pointer; font-size: 13px; font-weight: 500;
            transition: all 0.15s; text-decoration: none; white-space: nowrap;
        }
        .btn-primary { background: #238636; color: #fff; border-color: #238636; }
        .btn-primary:hover { background: #2ea043; }
        .btn-success { background: #1f6feb; color: #fff; border-color: #1f6feb; }
        .btn-success:hover { background: #388bfd; }
        .btn-danger { background: #da3633; color: #fff; border-color: #da3633; }
        .btn-danger:hover { background: #f85149; }
        .btn-outline { background: transparent; color: #8b949e; border-color: #30363d; }
        .btn-outline:hover { background: #21262d; border-color: #8b949e; color: #c9d1d9; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-xs { padding: 3px 8px; font-size: 11px; }

        input[type="text"], input[type="password"], input[type="number"] {
            background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
            padding: 8px 12px; border-radius: 6px; width: 100%; font-size: 14px;
        }
        input:focus { outline: none; border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(56,139,253,0.15); }
        input[type="checkbox"] { accent-color: #58a6ff; }
        label { display: block; margin-bottom: 4px; font-weight: 500; color: #8b949e; font-size: 13px; }
        .form-group { margin-bottom: 14px; }

        table { width: 100%; border-collapse: collapse; }
        th { padding: 8px 12px; text-align: left; font-size: 11px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #21262d; }
        td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #21262d; font-size: 14px; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: #1c2128; }

        .badge {
            display: inline-flex; align-items: center; padding: 3px 10px;
            border-radius: 12px; font-size: 11px; font-weight: 600;
        }
        .badge-on { background: #1a3a2a; color: #3fb950; }
        .badge-off { background: #21262d; color: #8b949e; }
        .badge-info { background: #12263a; color: #58a6ff; }
        .badge-warn { background: #3d2e00; color: #d29922; }

        .actions { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }

        .muted { color: #8b949e; }
        .text-sm { font-size: 13px; }

        .char-class {
            font-size: 12px; color: #8b949e; font-weight: 500;
            text-transform: capitalize;
        }

        .stat-value { font-weight: 600; color: #e6edf3; font-size: 13px; }
        .stat-label { color: #8b949e; font-size: 11px; }
    </style>
</head>
<body>
    <div class="container">
        {% if session.get("authenticated") %}
        <div class="nav">
            <a href="{{ url_for('index') }}">Dashboard</a>
            <span class="sep">|</span>
            <a href="{{ url_for('add_account') }}">Add Account</a>
            <span class="sep" style="margin-left: auto;"></span>
            <form method="post" action="{{ url_for('web_logout') }}" style="display:inline; margin-left: auto;">
                <button type="submit" class="btn btn-outline btn-sm">Logout</button>
            </form>
        </div>
        {% endif %}

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
